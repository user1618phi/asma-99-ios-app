name: Asma
options:
  bundleIdPrefix: com.asma
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  developmentLanguage: en
packages:
  DotLottie:
    url: https://github.com/LottieFiles/dotlottie-ios
    from: "0.5.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Asma:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Asma
        excludes:
          - "**/.DS_Store"
    resources:
      - Asma/Resources
    dependencies:
      - package: DotLottie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asma.namesofallah
        PRODUCT_NAME: "Asma"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Asma: 99 Names"
        INFOPLIST_KEY_CFBundleDevelopmentRegion: en
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Asma uses your microphone only while you tap the mic button to practice pronouncing a name. Audio is sent to Apple's speech recognition service to score your pronunciation and is not stored."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Asma scores your pronunciation of the names of Allah using Apple's speech recognition. Recordings are processed by Apple and are not stored by the app."
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
